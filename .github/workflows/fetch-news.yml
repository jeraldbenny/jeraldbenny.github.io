name: "🔬 DigiFeed — Daily Sync"

on:
  schedule:
    # Runs every day at 00:30 UTC (06:00 IST)
    - cron: "30 0 * * *"
  workflow_dispatch:
    # Also allow manual "Run workflow" trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  fetch-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "scripts/requirements.txt"

      - name: "📦 Install dependencies"
        run: pip install -r scripts/requirements.txt

      - name: "📡 Fetch news & generate AI summaries"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: python scripts/fetch_news.py

      - name: "🤖 Ingest fresh dispatches into Pinecone (DigiBot RAG)"
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/daily_ingest.py

      - name: "🏗️ Generate Hub & Ops HTML"
        run: python scripts/generate_hub.py

      - name: "✅ Commit & push updated hub"
        run: |
          git config user.name  "DigiFeed-Bot"
          git config user.email "actions@github.com"
          git add digifeed/ ops/
          if git diff --cached --quiet; then
            echo "No new articles found — skipping commit."
          else
            ARTICLE_COUNT=$(python -c "import json; d=json.load(open('digifeed/data.json')); print(d.get('total',0))")
            git commit -m "🔬 DigiFeed sync — ${ARTICLE_COUNT} dispatches [$(TZ='Asia/Kolkata' date '+%Y-%m-%d %H:%M IST')]"
            git push
          fi

      - name: "📱 Send Telegram Daily Briefing"
        if: success()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py --mode success

      - name: "🚨 Send Telegram Error Alert"
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/send_telegram.py --mode error
